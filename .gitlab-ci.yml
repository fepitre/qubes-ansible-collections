---
include:
  - file: /common.yml
    project: QubesOS/qubes-continuous-integration
  - file: /r4.3/gitlab-base.yml
    project: QubesOS/qubes-continuous-integration
  - file: /r4.3/gitlab-host.yml
    project: QubesOS/qubes-continuous-integration

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^test(-.*)?$/
      variables:
        CI_RUN_ALL_JOBS: "1"
    - when: always

variables:
  CI_RUN_ANSIBLE_JOBS:
    value: "1"
    description: "Run Ansible deploy tests, default: 1"
  CI_RUN_ALL_JOBS:
    value: "0"
    description: "Run all jobs, default: 0"
  CI_KEEP_TEST_QUBES:
    value: "0"
    description: "Keep test qubes after the run for troubleshooting, default: 0"
  SPLIT_SSH_PROJECT:
    value: "QubesOS/qubes-app-linux-split-ssh"
    description: "Project providing the qubes-split-ssh packages to validate"
  SPLIT_SSH_REF:
    value: ""
    description: "split-ssh ref (e.g. pr-1) to test against; empty disables the deploy job"

lint:
  extends: .lint
  stage: tests
  before_script:
    - if [ "$EUID" -ne 0 ]; then DNF="sudo dnf"; fi
    - ${DNF:-dnf} install -y python3-pip
    - pip3 install yamllint ansible-lint
  script:
    - yamllint .
    - ansible-lint

shellcheck:
  extends: .shellcheck
  stage: tests

# Cross-project needs:project (artifact download from another project) is a
# GitLab Premium feature, so on free tier we pull the split-ssh build artifacts
# from the public artifacts directly.
fetch:split-ssh:
  stage: build
  image: fedora:latest
  tags:
    - docker
  rules:
    - if: '($CI_RUN_ANSIBLE_JOBS == "1" || $CI_RUN_ALL_JOBS == "1") && $SPLIT_SSH_REF != ""'
      when: always
  artifacts:
    expire_in: 1 day
    paths:
      - artifacts/repository
  before_script:
    - dnf install -y python3 findutils
  script:
    - |
      python3 - <<'PY'
      import json, os, subprocess, urllib.parse, urllib.request
      api = "https://gitlab.com/api/v4"
      proj = urllib.parse.quote(os.environ["SPLIT_SSH_PROJECT"], safe="")
      ref = os.environ["SPLIT_SSH_REF"]

      def get(path):
          with urllib.request.urlopen(api + path) as r:
              return json.load(r)

      q = urllib.parse.quote(ref)
      pls = get(f"/projects/{proj}/pipelines?ref={q}&order_by=id&sort=desc&per_page=1")
      if not pls:
          raise SystemExit(f"no pipeline for ref {ref}")
      pid = pls[0]["id"]
      print("pipeline", pid)
      jobs = get(f"/projects/{proj}/pipelines/{pid}/jobs?per_page=100")
      byname = {j["name"]: j for j in jobs}
      for name in ("r4.3:build:host-fc41", "r4.3:build:vm-fc43"):
          j = byname.get(name)
          if not j or j["status"] != "success":
              raise SystemExit(f"job {name}: {j and j['status']}")
          print("download", name, j["id"])
          urllib.request.urlretrieve(f"{api}/projects/{proj}/jobs/{j['id']}/artifacts", "ss.zip")
          subprocess.check_call(["python3", "-m", "zipfile", "-e", "ss.zip", "."])
          os.remove("ss.zip")
      PY
    - find artifacts/repository -name 'qubes-split-ssh*' -ls

.ansible-deploy:
  rules:
    - if: $CI_RUN_ANSIBLE_JOBS == "1" || $CI_RUN_ALL_JOBS == "1"
      when: always
    - when: never
  stage: tests
  tags:
    - vm-kvm
  before_script:
    - sudo qubes-dom0-update --enablerepo=qubes-dom0-current-testing -y
    - sudo qubes-dom0-update --enablerepo=qubes-dom0-current-testing -y ansible qubes-ansible-dom0
    - >-
      find "$CI_PROJECT_DIR"/artifacts/repository/host-fc*
      -name 'qubes-ansible-setup-*.noarch.rpm'
      -exec sudo dnf install -y {} \+
    - >-
      qvm-run -p -u root "${TEST_TEMPLATE}"
      'dnf update -y --enablerepo=qubes-vm-r4.3-current-testing'
    - >-
      qvm-run -p -u root "${TEST_TEMPLATE}"
      'dnf install -y --enablerepo=qubes-vm-r4.3-current-testing qubes-ansible-vm'
    - qvm-shutdown --wait "${TEST_TEMPLATE}"
  script:
    - sudo ansible-playbook -vvvv tests/test.yml -e test_template="${TEST_TEMPLATE}" -e test_prefix=ci
  after_script:
    - if [ "$CI_KEEP_TEST_QUBES" = "1" ]; then echo "CI_KEEP_TEST_QUBES=1, keeping test qubes"; exit 0; fi
    - >-
      sudo ansible-playbook -vvvv tests/cleanup.yml
      -e test_template="${TEST_TEMPLATE}" -e test_prefix=ci 2>/dev/null || true

# Runs only when SPLIT_SSH_REF is set. The split-ssh packages come from
# fetch:split-ssh (same-project artifacts). Installs qubes-split-ssh-dom0 in
# dom0 and qubes-split-ssh into the test template before the deploy playbook.
r4.3:ansible-deploy:
  extends: .ansible-deploy
  rules:
    - if: '($CI_RUN_ANSIBLE_JOBS == "1" || $CI_RUN_ALL_JOBS == "1") && $SPLIT_SSH_REF != ""'
      when: always
  needs:
    - r4.3:build:host-fc41
    - fetch:split-ssh
  variables:
    TEST_TEMPLATE: fedora-43-xfce
    VM_IMAGE: qubes_4.3_64bit_stable.qcow2
  before_script:
    - !reference [.ansible-deploy, before_script]
    - >-
      find "$CI_PROJECT_DIR"/artifacts/repository/host-fc*
      -name 'qubes-split-ssh-dom0-*.noarch.rpm'
      -exec sudo dnf install -y {} \+
    - >-
      RPM=$(find "$CI_PROJECT_DIR"/artifacts/repository/vm-fc*
      -name 'qubes-split-ssh-*.noarch.rpm' ! -name '*dom0*' | head -1);
      cat "$RPM" | qvm-run -p -u root "${TEST_TEMPLATE}"
      'cat >/tmp/qubes-split-ssh.rpm && dnf install -y /tmp/qubes-split-ssh.rpm && rm -f /tmp/qubes-split-ssh.rpm'
    - qvm-shutdown --wait "${TEST_TEMPLATE}"

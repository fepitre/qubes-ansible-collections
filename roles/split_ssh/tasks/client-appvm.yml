---
- name: Validate split_ssh_vault is set
  ansible.builtin.assert:
    that:
      - split_ssh_vault | length > 0
    fail_msg: "'split_ssh_vault' is required (e.g. 'vault-ssh')."

- name: Write split-SSH vault qube name
  ansible.builtin.copy:
    dest: "{{ split_ssh_vault_file }}"
    content: "{{ split_ssh_vault }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Write split-SSH default agent file
  ansible.builtin.copy:
    dest: "{{ split_ssh_default_agent_file }}"
    content: "{{ split_ssh_default_agent }}\n"
    owner: "{{ split_ssh_user }}"
    group: "{{ split_ssh_user }}"
    mode: "0644"
  when: split_ssh_default_agent | length > 0

- name: Remove split-SSH default agent file when unset
  ansible.builtin.file:
    path: "{{ split_ssh_default_agent_file }}"
    state: absent
  when: split_ssh_default_agent | length == 0

- name: Ensure rc.local.d exists for split-SSH proxy
  ansible.builtin.file:
    path: "{{ split_ssh_rc_local_d }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop split-SSH proxy rc.local.d snippet
  ansible.builtin.template:
    src: rc-local-forwarders.j2
    dest: "{{ split_ssh_rc_local_d }}/30-split-ssh-proxy.rc"
    owner: root
    group: root
    mode: "0755"

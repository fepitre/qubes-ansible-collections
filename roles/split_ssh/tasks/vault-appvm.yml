---
- name: Write split-SSH default agent file
  ansible.builtin.copy:
    dest: "{{ split_ssh_default_agent_file }}"
    content: "{{ split_ssh_default_agent }}\n"
    owner: "{{ split_ssh_user }}"
    group: "{{ split_ssh_user }}"
    mode: "0644"
  when: split_ssh_default_agent | length > 0

- name: Remove split-SSH default agent file when unset
  ansible.builtin.file:
    path: "{{ split_ssh_default_agent_file }}"
    state: absent
  when: split_ssh_default_agent | length == 0

- name: Ensure ~/.ssh exists for vault user
  ansible.builtin.file:
    path: "/home/{{ split_ssh_user }}/.ssh"
    state: directory
    owner: "{{ split_ssh_user }}"
    group: "{{ split_ssh_user }}"
    mode: "0700"

- name: Create per-agent identities directories
  ansible.builtin.file:
    path: "/home/{{ split_ssh_user }}/.ssh/identities.d/{{ item }}"
    state: directory
    owner: "{{ split_ssh_user }}"
    group: "{{ split_ssh_user }}"
    mode: "0700"
  loop: "{{ split_ssh_agents }}"

- name: Ensure rc.local.d exists for split-SSH vault
  ansible.builtin.file:
    path: "{{ split_ssh_rc_local_d }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop split-SSH vault ssh-agent rc.local.d snippet
  ansible.builtin.template:
    src: rc-local-agents.j2
    dest: "{{ split_ssh_rc_local_d }}/30-split-ssh-vault.rc"
    owner: root
    group: root
    mode: "0755"

- name: Export SSH_AUTH_SOCK in vault user shell
  ansible.builtin.blockinfile:
    path: "/home/{{ split_ssh_user }}/.bashrc"
    create: true
    owner: "{{ split_ssh_user }}"
    group: "{{ split_ssh_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - split-SSH vault SSH_AUTH_SOCK"
    block: |
      export SSH_AUTH_SOCK="/run/split-ssh/{{ split_ssh_default_agent }}.sock"
  when: split_ssh_default_agent | length > 0

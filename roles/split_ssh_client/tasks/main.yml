---
- name: Validate split_ssh_client_vault is set
  ansible.builtin.assert:
    that:
      - split_ssh_client_vault | length > 0
    fail_msg: "'split_ssh_client_vault' is required (e.g. 'vault-ssh')."

- name: Validate split_ssh_client_agents is non-empty
  ansible.builtin.assert:
    that:
      - split_ssh_client_agents | length > 0
    fail_msg: "'split_ssh_client_agents' must list at least one agent name."

- name: Validate agent names
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$')
    fail_msg: "Invalid agent name '{{ item }}'."
  loop: "{{ split_ssh_client_agents }}"

- name: Create split-ssh lib directory
  ansible.builtin.file:
    path: /usr/local/lib/split-ssh
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install split-ssh-forwarder start script
  ansible.builtin.template:
    src: start-ssh-forwarder.j2
    dest: /usr/local/lib/split-ssh/start-forwarder
    owner: root
    group: root
    mode: "0755"

- name: Ensure systemd unit directory exists
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install split-ssh-forwarder templated systemd unit
  ansible.builtin.template:
    src: split-ssh-forwarder@.service.j2
    dest: /usr/local/lib/systemd/system/split-ssh-forwarder@.service
    owner: root
    group: root
    mode: "0644"

- name: Write split-SSH default agent file
  ansible.builtin.copy:
    dest: "{{ split_ssh_client_default_agent_file }}"
    content: "{{ split_ssh_client_default_agent }}\n"
    owner: "{{ split_ssh_client_user }}"
    group: "{{ split_ssh_client_user }}"
    mode: "0644"
  when: split_ssh_client_default_agent | length > 0

- name: Remove split-SSH default agent file when unset
  ansible.builtin.file:
    path: "{{ split_ssh_client_default_agent_file }}"
    state: absent
  when: split_ssh_client_default_agent | length == 0

- name: Ensure rc.local exists for split-SSH proxy
  ansible.builtin.file:
    path: "{{ split_ssh_client_rc_local_path }}"
    state: touch
    owner: root
    group: root
    mode: "0755"

- name: Start split-ssh-forwarder services from rc.local
  ansible.builtin.blockinfile:
    path: "{{ split_ssh_client_rc_local_path }}"
    marker: "# {mark} ANSIBLE MANAGED - split-SSH proxy"
    block: "{{ lookup('template', 'rc-local-forwarders.j2') }}"

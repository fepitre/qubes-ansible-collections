---
- name: Validate split_gpg_vault is set
  ansible.builtin.assert:
    that:
      - split_gpg_vault | length > 0
    fail_msg: "'split_gpg_vault' is required (e.g. 'vault-gpg')."

- name: Set GPG vault domain for qubes-gpg-client-wrapper
  ansible.builtin.copy:
    dest: "{{ split_gpg_domain_file }}"
    content: "{{ split_gpg_vault }}\n"
    owner: "{{ split_gpg_user }}"
    group: "{{ split_gpg_user }}"
    mode: "0644"

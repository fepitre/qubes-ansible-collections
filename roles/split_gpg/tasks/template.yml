---
- name: Install split-GPG packages
  ansible.builtin.package:
    name: "{{ split_gpg_packages }}"
    state: latest

- name: Remove obsolete split-GPG profile drop-in (now defaulted by qubes-gpg-split)
  ansible.builtin.file:
    path: /etc/profile.d/qubes-split-gpg.sh
    state: absent
  when: split_gpg_role == 'client'

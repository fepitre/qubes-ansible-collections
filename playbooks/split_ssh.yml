---
- name: Build initial groups
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  vars:
    policy_action: "{{ policy | default('allow') }}"
  tasks:
    - name: Validate input (single vault or a vaults map)
      ansible.builtin.assert:
        that:
          - (vaults is defined) or (vault is defined and client_agents is defined)
          - policy_action in ['allow', 'ask']
        fail_msg: >-
          Provide 'vaults' ({vault: {client: [agents]}}) or 'vault' + 'client_agents';
          policy must be 'allow' or 'ask'.

    - name: Normalize input to a vaults map (vault to client-agents)
      ansible.builtin.set_fact:
        ssh_vaults_map: "{{ vaults if vaults is defined else {vault: client_agents} }}"
        policy_action: "{{ policy_action }}"

    - name: Validate every client has at least one agent
      vars:
        _empty: >-
          {{ ssh_vaults_map.values() | map('dict2items') | flatten
             | selectattr('value', 'equalto', []) | map(attribute='key') | list }}
      ansible.builtin.assert:
        that:
          - _empty | length == 0
        fail_msg: "Clients with an empty agent list: {{ _empty }}"

    - name: Validate each client is routed to exactly one vault
      vars:
        _all_clients: "{{ ssh_vaults_map.values() | map('list') | flatten }}"
      ansible.builtin.assert:
        that:
          - _all_clients | length == (_all_clients | unique | list | length)
        fail_msg: >-
          A client appears under more than one vault; each client's forwarder
          targets a single vault.

    - name: Build client -> vault map
      ansible.builtin.set_fact:
        ssh_client_vault: >-
          {{ ssh_client_vault | default({})
             | combine(dict(item.value.keys() | list | zip_longest([], fillvalue=item.key))) }}
      loop: "{{ ssh_vaults_map | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Validate create_vault prerequisites
      ansible.builtin.assert:
        that:
          - vault_template is defined
          - vault_template | length > 0
        fail_msg: "'vault_template' is required when create_vault=true."
      when: create_vault | default(false) | bool

    - name: Create vault qubes
      qubesos.core.qube:
        name: "{{ item }}"
        state: present
        klass: AppVM
        template: "{{ vault_template }}"
        properties:
          label: "{{ vault_label | default('black') }}"
          netvm: ""
      loop: "{{ ssh_vaults_map.keys() | list }}"
      when: create_vault | default(false) | bool

    - name: Add vault qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: ssh_vaults
      loop: "{{ ssh_vaults_map.keys() | list }}"

    - name: Add client qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: ssh_clients
      loop: "{{ ssh_client_vault.keys() | list }}"

- name: Gather qube facts
  hosts: ssh_vaults:ssh_clients
  gather_facts: false
  strategy: ansible.builtin.linear
  connection: ansible.builtin.local
  any_errors_fatal: true
  tasks:
    - name: Gather qube facts
      qubesos.core.qube_facts:
        name: "{{ inventory_hostname }}"
      delegate_to: localhost

- name: Discover templates from facts
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  tasks:
    - name: Add vault templates
      ansible.builtin.add_host:
        name: >-
          {%- if hostvars[item].qubes_facts.properties.klass == 'AppVM' -%}
          {{ hostvars[item].qubes_facts.properties.template }}
          {%- else -%}
          {{ item }}
          {%- endif -%}
        groups: ssh_vault_templates
        ansible_connection: qubesos.core.qubes
        _ssh_agent_list: "{{ ssh_vaults_map[item].values() | flatten | unique | list }}"
      loop: "{{ groups['ssh_vaults'] }}"

    - name: Add client templates
      ansible.builtin.add_host:
        name: >-
          {%- if hostvars[item].qubes_facts.properties.klass == 'AppVM' -%}
          {{ hostvars[item].qubes_facts.properties.template }}
          {%- else -%}
          {{ item }}
          {%- endif -%}
        groups: ssh_client_templates
        ansible_connection: qubesos.core.qubes
      loop: "{{ groups['ssh_clients'] }}"

    - name: Set connection for vault qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_connection: qubesos.core.qubes
        _ssh_agent_list: "{{ ssh_vaults_map[item].values() | flatten | unique | list }}"
        _ssh_default_agent: >-
          {{ vault_default_agent
             if (vault_default_agent | default('')) in (ssh_vaults_map[item].values() | flatten | unique | list)
             else '' }}
      loop: "{{ groups['ssh_vaults'] }}"

    - name: Set connection for client qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_connection: qubesos.core.qubes
        _ssh_agent_list: "{{ ssh_vaults_map[ssh_client_vault[item]][item] }}"
        _ssh_default_agent: >-
          {{ client_default_agent
             if (client_default_agent | default('')) in ssh_vaults_map[ssh_client_vault[item]][item]
             else '' }}
        _ssh_vault: "{{ ssh_client_vault[item] }}"
      loop: "{{ groups['ssh_clients'] }}"

- name: Prepare templates
  hosts: ssh_vault_templates:ssh_client_templates
  remote_user: root
  gather_facts: false
  collections:
    - qubesos.setup
  roles:
    - role: split_ssh
      vars:
        split_ssh_role: vault
        split_ssh_phase: template
        split_ssh_agents: "{{ _ssh_agent_list }}"
      when: inventory_hostname in groups.get('ssh_vault_templates', [])
    - role: split_ssh
      vars:
        split_ssh_role: client
        split_ssh_phase: template
      when: inventory_hostname in groups.get('ssh_client_templates', [])

- name: Configure SSH vault qube
  hosts: ssh_vaults
  remote_user: root
  gather_facts: false
  collections:
    - qubesos.setup
  roles:
    - role: split_ssh
      vars:
        split_ssh_role: vault
        split_ssh_phase: appvm
        split_ssh_agents: "{{ _ssh_agent_list }}"
        split_ssh_default_agent: "{{ _ssh_default_agent }}"

- name: Configure SSH client qubes
  hosts: ssh_clients
  remote_user: root
  gather_facts: false
  collections:
    - qubesos.setup
  roles:
    - role: split_ssh
      vars:
        split_ssh_role: client
        split_ssh_phase: appvm
        split_ssh_vault: "{{ _ssh_vault }}"
        split_ssh_agents: "{{ _ssh_agent_list }}"
        split_ssh_default_agent: "{{ _ssh_default_agent }}"

- name: Install split-SSH dom0 policy
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  become: true
  tasks:
    - name: Install qubes-split-ssh-dom0 package
      ansible.builtin.package:
        name: qubes-split-ssh-dom0
        state: present

    - name: Write per-vault qubes.SshAgent allow policy
      ansible.builtin.template:
        src: templates/split-ssh.policy.j2
        dest: "/etc/qubes/policy.d/30-split-ssh-{{ item.key }}.policy"
        mode: "0664"
        owner: root
        group: qubes
      vars:
        vault: "{{ item.key }}"
        client_to_agents: "{{ item.value }}"
      loop: "{{ ssh_vaults_map | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Remove obsolete standalone deny policy (now shipped by qubes-split-ssh-dom0)
      ansible.builtin.file:
        path: /etc/qubes/policy.d/99-split-ssh-deny.policy
        state: absent

- name: Shutdown templates and qubes
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  tasks:
    - name: Shut down templates
      qubesos.core.qube:
        name: "{{ item }}"
        state: halted
        klass: TemplateVM
      loop: "{{ (groups.get('ssh_vault_templates', []) + groups.get('ssh_client_templates', [])) | unique }}"

    - name: Shut down qubes
      qubesos.core.qube:
        name: "{{ item }}"
        state: halted
        klass: "{{ hostvars[item].qubes_facts.properties.klass }}"
      loop: "{{ (groups.get('ssh_vaults', []) + groups.get('ssh_clients', [])) | unique }}"

---
- name: Build initial groups
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  tasks:
    - name: Validate input (single vault or a vaults map)
      ansible.builtin.assert:
        that:
          - (vaults is defined) or (vault is defined and clients is defined)
        fail_msg: >-
          Provide either 'vaults' (a {vault: [clients]} map) or 'vault' + 'clients'.

    - name: Normalize input to a vault -> clients map
      ansible.builtin.set_fact:
        gpg_vaults_map: >-
          {{ vaults if vaults is defined
             else {vault: ((clients.split(',') if clients is string else clients)
                           | map('trim') | list)} }}

    - name: Validate every vault has at least one client
      ansible.builtin.assert:
        that:
          - gpg_vaults_map[item] | length > 0
        fail_msg: "Vault '{{ item }}' has no clients."
      loop: "{{ gpg_vaults_map.keys() | list }}"

    - name: Validate each client is routed to exactly one vault
      vars:
        _all_clients: "{{ gpg_vaults_map.values() | list | flatten }}"
      ansible.builtin.assert:
        that:
          - _all_clients | length == (_all_clients | unique | list | length)
        fail_msg: >-
          A client appears under more than one vault; @default routing needs
          exactly one vault per client.

    - name: Build client -> vault map
      ansible.builtin.set_fact:
        gpg_client_vault: "{{ gpg_client_vault | default({}) | combine({item.1: item.0.key}) }}"
      loop: "{{ gpg_vaults_map | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1 }}"

    - name: Validate create_vault prerequisites
      ansible.builtin.assert:
        that:
          - vault_template is defined
          - vault_template | length > 0
        fail_msg: "'vault_template' is required when create_vault=true."
      when: create_vault | default(false) | bool

    - name: Create vault qubes
      qubesos.core.qube:
        name: "{{ item }}"
        state: present
        klass: AppVM
        template: "{{ vault_template }}"
        properties:
          label: "{{ vault_label | default('black') }}"
          netvm: ""
      loop: "{{ gpg_vaults_map.keys() | list }}"
      when: create_vault | default(false) | bool

    - name: Add vault qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: gpg_vaults
      loop: "{{ gpg_vaults_map.keys() | list }}"

    - name: Add client qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: gpg_clients
      loop: "{{ gpg_client_vault.keys() | list }}"

- name: Gather qube facts
  hosts: gpg_vaults:gpg_clients
  gather_facts: false
  strategy: ansible.builtin.linear
  connection: ansible.builtin.local
  any_errors_fatal: true
  tasks:
    - name: Gather qube facts
      qubesos.core.qube_facts:
        name: "{{ inventory_hostname }}"
      delegate_to: localhost

- name: Discover templates from facts
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  tasks:
    - name: Add vault templates
      ansible.builtin.add_host:
        name: >-
          {%- if hostvars[item].qubes_facts.properties.klass == 'AppVM' -%}
          {{ hostvars[item].qubes_facts.properties.template }}
          {%- else -%}
          {{ item }}
          {%- endif -%}
        groups: gpg_vault_templates
        ansible_connection: qubesos.core.qubes
      loop: "{{ groups['gpg_vaults'] }}"

    - name: Add client templates
      ansible.builtin.add_host:
        name: >-
          {%- if hostvars[item].qubes_facts.properties.klass == 'AppVM' -%}
          {{ hostvars[item].qubes_facts.properties.template }}
          {%- else -%}
          {{ item }}
          {%- endif -%}
        groups: gpg_client_templates
        ansible_connection: qubesos.core.qubes
      loop: "{{ groups['gpg_clients'] }}"

    - name: Set connection for vault qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_connection: qubesos.core.qubes
      loop: "{{ groups['gpg_vaults'] }}"

    - name: Set connection for client qubes
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_connection: qubesos.core.qubes
        _gpg_vault: "{{ gpg_client_vault[item] }}"
      loop: "{{ groups['gpg_clients'] }}"

- name: Prepare templates
  hosts: gpg_vault_templates:gpg_client_templates
  remote_user: root
  gather_facts: false
  collections:
    - qubesos.setup
  roles:
    - role: split_gpg
      vars:
        split_gpg_role: vault
        split_gpg_phase: template
      when: inventory_hostname in groups.get('gpg_vault_templates', [])
    - role: split_gpg
      vars:
        split_gpg_role: client
        split_gpg_phase: template
      when: inventory_hostname in groups.get('gpg_client_templates', [])

- name: Configure GPG vault qube
  hosts: gpg_vaults
  remote_user: root
  gather_facts: false
  collections:
    - qubesos.setup
  roles:
    - role: split_gpg
      vars:
        split_gpg_role: vault
        split_gpg_phase: appvm

- name: Configure GPG client qubes
  hosts: gpg_clients
  remote_user: root
  gather_facts: false
  collections:
    - qubesos.setup
  roles:
    - role: split_gpg
      vars:
        split_gpg_role: client
        split_gpg_phase: appvm

- name: Install split-GPG RPC policy
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  become: true
  tasks:
    - name: Write per-vault qubes.Gpg allow policy
      ansible.builtin.template:
        src: templates/split-gpg.policy.j2
        dest: "/etc/qubes/policy.d/30-split-gpg-{{ item.key }}.policy"
        mode: "0664"
        owner: root
        group: qubes
      vars:
        vault: "{{ item.key }}"
        client_list: "{{ item.value }}"
      loop: "{{ gpg_vaults_map | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: Shutdown templates and qubes
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false
  tasks:
    - name: Shut down templates
      qubesos.core.qube:
        name: "{{ item }}"
        state: halted
        klass: TemplateVM
      loop: "{{ (groups.get('gpg_vault_templates', []) + groups.get('gpg_client_templates', [])) | unique }}"

    - name: Shut down qubes
      qubesos.core.qube:
        name: "{{ item }}"
        state: halted
        klass: "{{ hostvars[item].qubes_facts.properties.klass }}"
      loop: "{{ (groups.get('gpg_vaults', []) + groups.get('gpg_clients', [])) | unique }}"
